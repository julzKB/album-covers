<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Album Covers</title>
<style>
  :root {
    --bg: #fbfbf9; --fg: #1a1a1a; --muted: #6b6b6b;
    --card: #ffffff; --line: #e4e4e0; --ok: #1c7c4a; --okbg: #e8f5ee;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141414; --fg: #ececec; --muted: #9a9a9a;
            --card: #1d1d1d; --line: #2e2e2e; --ok: #6ede9f; --okbg: #16301f; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.5rem; background: var(--bg); color: var(--fg);
    font: 16px/1.6 ui-sans-serif, -apple-system, "Helvetica Neue", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 1.4rem; font-weight: 650; margin: 0 0 .3rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1.5rem; }
  .bar { margin: 0 0 2.5rem; }
  .grid { display: grid; gap: 2rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line);
           border-radius: 10px; overflow: hidden; }
  .shot { display: block; }
  img { display: block; width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; }
  figcaption { padding: .9rem 1rem 1rem; }
  .album { font-weight: 600; font-size: .95rem; }
  .artist { color: var(--muted); font-size: .85rem; margin-top: .1rem; }

  button { font: inherit; color: inherit; cursor: pointer; }
  .copy {
    display: flex; align-items: flex-start; gap: .6rem; width: 100%; text-align: left;
    margin-top: .7rem; padding: .55rem .6rem; background: var(--bg);
    border: 1px solid var(--line); border-radius: 6px; transition: border-color .15s;
  }
  .copy:hover { border-color: var(--muted); }
  /* Wrap rather than truncate: the whole point is showing the full URL, and
     the album title is already on the card so a truncated tail adds nothing. */
  .copy .url {
    flex: 1; min-width: 0; font-size: .68rem; line-height: 1.45;
    word-break: break-all; text-align: left;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted);
  }
  .copy .hint { flex: none; margin-top: .1rem; font-size: .62rem; font-weight: 700;
                letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
  .copy.done { border-color: var(--ok); background: var(--okbg); }
  .copy.done .hint, .copy.done .url { color: var(--ok); }

  .copyall {
    padding: .45rem .8rem; background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; font-size: .82rem;
  }
  .copyall:hover { border-color: var(--muted); }
  .copyall.done { border-color: var(--ok); background: var(--okbg); color: var(--ok); }
</style>
</head>
<body>
<main>
  <h1>Album Covers</h1>
  <p class="sub">6 albums, 1024&times;1024 JPEG. Click a URL to copy it.</p>
  <p class="bar"><button class="copyall" type="button">Copy all URLs</button></p>
  <div class="grid">

    <figure>
      <a class="shot" href="Cue%20%26%20Underscore/cover.jpg" target="_blank" rel="noopener">
        <img src="Cue%20%26%20Underscore/cover.jpg" alt="Cue &amp; Underscore cover" loading="lazy" width="1024" height="1024">
      </a>
      <figcaption>
        <div class="album">Cue &amp; Underscore</div>
        <div class="artist">The Wolf Tone Ensemble</div>
        <button class="copy" type="button" data-url="https://www.julienleveugle.com/album-covers/Cue%20%26%20Underscore/cover.jpg">
          <span class="url">https://www.julienleveugle.com/album-covers/Cue%20%26%20Underscore/cover.jpg</span>
          <span class="hint" aria-hidden="true">Copy</span>
        </button>
      </figcaption>
    </figure>

    <figure>
      <a class="shot" href="Ground%20Control%20Lullabies/cover.jpg" target="_blank" rel="noopener">
        <img src="Ground%20Control%20Lullabies/cover.jpg" alt="Ground Control Lullabies cover" loading="lazy" width="1024" height="1024">
      </a>
      <figcaption>
        <div class="album">Ground Control Lullabies</div>
        <div class="artist">The Sputnik Cascades</div>
        <button class="copy" type="button" data-url="https://www.julienleveugle.com/album-covers/Ground%20Control%20Lullabies/cover.jpg">
          <span class="url">https://www.julienleveugle.com/album-covers/Ground%20Control%20Lullabies/cover.jpg</span>
          <span class="hint" aria-hidden="true">Copy</span>
        </button>
      </figcaption>
    </figure>

    <figure>
      <a class="shot" href="Mademoiselle%20Tokyo/cover.jpg" target="_blank" rel="noopener">
        <img src="Mademoiselle%20Tokyo/cover.jpg" alt="Mademoiselle Tokyo cover" loading="lazy" width="1024" height="1024">
      </a>
      <figcaption>
        <div class="album">Mademoiselle Tokyo</div>
        <div class="artist">Nouvelle Ginza</div>
        <button class="copy" type="button" data-url="https://www.julienleveugle.com/album-covers/Mademoiselle%20Tokyo/cover.jpg">
          <span class="url">https://www.julienleveugle.com/album-covers/Mademoiselle%20Tokyo/cover.jpg</span>
          <span class="hint" aria-hidden="true">Copy</span>
        </button>
      </figcaption>
    </figure>

    <figure>
      <a class="shot" href="Transmission%2047/cover.jpg" target="_blank" rel="noopener">
        <img src="Transmission%2047/cover.jpg" alt="Transmission 47 cover" loading="lazy" width="1024" height="1024">
      </a>
      <figcaption>
        <div class="album">Transmission 47</div>
        <div class="artist">Onde Spatiale</div>
        <button class="copy" type="button" data-url="https://www.julienleveugle.com/album-covers/Transmission%2047/cover.jpg">
          <span class="url">https://www.julienleveugle.com/album-covers/Transmission%2047/cover.jpg</span>
          <span class="hint" aria-hidden="true">Copy</span>
        </button>
      </figcaption>
    </figure>

    <figure>
      <a class="shot" href="Vorkurs%20Sessions/cover.jpg" target="_blank" rel="noopener">
        <img src="Vorkurs%20Sessions/cover.jpg" alt="Vorkurs Sessions cover" loading="lazy" width="1024" height="1024">
      </a>
      <figcaption>
        <div class="album">Vorkurs Sessions</div>
        <div class="artist">Dessau Drift</div>
        <button class="copy" type="button" data-url="https://www.julienleveugle.com/album-covers/Vorkurs%20Sessions/cover.jpg">
          <span class="url">https://www.julienleveugle.com/album-covers/Vorkurs%20Sessions/cover.jpg</span>
          <span class="hint" aria-hidden="true">Copy</span>
        </button>
      </figcaption>
    </figure>

    <figure>
      <a class="shot" href="Yellow%20Monitor%20Dreams/cover.jpg" target="_blank" rel="noopener">
        <img src="Yellow%20Monitor%20Dreams/cover.jpg" alt="Yellow Monitor Dreams cover" loading="lazy" width="1024" height="1024">
      </a>
      <figcaption>
        <div class="album">Yellow Monitor Dreams</div>
        <div class="artist">Static Age</div>
        <button class="copy" type="button" data-url="https://www.julienleveugle.com/album-covers/Yellow%20Monitor%20Dreams/cover.jpg">
          <span class="url">https://www.julienleveugle.com/album-covers/Yellow%20Monitor%20Dreams/cover.jpg</span>
          <span class="hint" aria-hidden="true">Copy</span>
        </button>
      </figcaption>
    </figure>

  </div>
</main>
<script>
// Clipboard API needs a secure context. The canonical host is HTTPS, but the
// julzkb.github.io alias redirects to http://, so keep a legacy fallback.
async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* fall through */ }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:absolute;left:-9999px;top:0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function flash(btn, label) {
  const hint = btn.querySelector('.hint') || btn;
  const original = hint.textContent;
  hint.textContent = label;
  btn.classList.add('done');
  clearTimeout(btn._t);
  btn._t = setTimeout(() => {
    hint.textContent = original;
    btn.classList.remove('done');
  }, 1400);
}

document.querySelectorAll('.copy').forEach(btn => {
  btn.addEventListener('click', async () => {
    flash(btn, (await copyText(btn.dataset.url)) ? 'Copied' : 'Failed');
  });
});

const all = document.querySelector('.copyall');
if (all) {
  const urls = [...document.querySelectorAll('.copy')].map(b => b.dataset.url).join('\n');
  all.addEventListener('click', async () => {
    const ok = await copyText(urls);
    all.textContent = ok ? 'Copied all URLs' : 'Copy failed';
    all.classList.add('done');
    clearTimeout(all._t);
    all._t = setTimeout(() => {
      all.textContent = 'Copy all URLs';
      all.classList.remove('done');
    }, 1400);
  });
}
</script>
</body>
</html>
