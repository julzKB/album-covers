name: Build gallery

# Regenerates index.html and the README table whenever an album folder
# changes, so adding a cover is just: create the folder, push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-gallery
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate index.html and README table
        run: python3 generate.py

      - name: Commit if anything changed
        run: |
          if [[ -z "$(git status --porcelain index.html README.md)" ]]; then
            echo "gallery already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          git commit -m "Rebuild gallery [skip ci]"
          git push
